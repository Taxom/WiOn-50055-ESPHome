# Copy these entries into secrets.yaml beside wion_50055_v1.0.0.yaml.
# Replace every example value before compiling.

wifi_ssid: "YOUR_WIFI_SSID"
wifi_password: "YOUR_WIFI_PASSWORD"

ota_password: "CHANGE_TO_A_LONG_RANDOM_OTA_PASSWORD"

web_username: "admin"
web_password: "CHANGE_TO_A_LONG_RANDOM_WEB_PASSWORD"

# Password-protected fallback / captive-portal AP.
fallback_ap_password: "CHANGE_TO_A_LONG_RANDOM_SETUP_PASSWORD"

# 32 random bytes, Base64 encoded.
# Generate locally:
# python -c "import secrets,base64; print(base64.b64encode(secrets.token_bytes(32)).decode())"
api_encryption_key: "PASTE_BASE64_KEY_HERE"
