substitutions:
  device_name: wion-50055
  friendly_name: "WiOn 50055"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: "WiOn v1.1.0 firmware for Woods WiOn 50055"
  min_version: 2026.8.2
  includes:
    - wion_power_bridge.h
  on_boot:
    - priority: 600
      then:
        - lambda: |-
            wion_bus_setup();

    - priority: -100
      then:
        - lambda: |-
            bool desired = false;
            if (id(startup_mode_code) == 1) {
              desired = true;
            } else if (id(startup_mode_code) == 2) {
              desired = id(last_outlet_state);
            }

            if (desired) {
              id(outlet_relay).turn_on();
            } else {
              id(outlet_relay).turn_off();
            }

            id(boot_initializing) = false;

            const String rr = ESP.getResetReason();
            id(reset_reason).publish_state(rr.c_str());
            ESP_LOGI("wion.boot", "Reset reason: %s", rr.c_str());

esp8266:
  board: esp01_1m
  restore_from_flash: true

preferences:
  flash_write_interval: 1s

logger:
  level: DEBUG
  baud_rate: 0

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2
  power_save_mode: none
  reboot_timeout: 0s

  ap:
    ssid: "WiOn-50055 Setup"
    password: !secret fallback_ap_password
    ap_timeout: 90s

  on_connect:
    - output.turn_on: blue_led_output
  on_disconnect:
    - output.turn_off: blue_led_output

captive_portal:

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

safe_mode:
  num_attempts: 5
  boot_is_good_after: 1min
  reboot_timeout: 10min
  storage: rtc

web_server:
  port: 80
  version: 2
  log: true
  include_internal: true
  auth:
    type: digest
    username: !secret web_username
    password: !secret web_password

output:
  - platform: gpio
    id: blue_led_output
    pin:
      number: GPIO2
      inverted: true

switch:
  - platform: gpio
    id: outlet_relay
    name: "Outlet"
    pin: GPIO15
    restore_mode: ALWAYS_OFF

    on_turn_on:
      - lambda: |-
          if (!id(boot_initializing) && id(startup_mode_code) == 2)
            id(last_outlet_state) = true;

          if (id(zero_cal_pending)) {
            id(zero_cal_pending) = false;
            id(zero_calibration_status).publish_state("Cancelled: outlet turned ON");
            ESP_LOGW("wion", "Zero calibration cancelled because outlet was turned ON");
          }

    on_turn_off:
      - lambda: |-
          if (!id(boot_initializing) && id(startup_mode_code) == 2)
            id(last_outlet_state) = false;

  - platform: gpio
    id: outlet_backlight
    name: "Outlet Backlight"
    pin: GPIO14
    restore_mode: RESTORE_DEFAULT_OFF

binary_sensor:
  - platform: gpio
    id: physical_button
    name: "Physical Button"
    internal: true
    pin:
      number: GPIO13
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on_off: 20ms

    on_multi_click:
      - timing:
          - ON for at most 1s
          - OFF for at least 50ms
        then:
          - switch.toggle: outlet_relay

      - timing:
          - ON for at least 30s
        then:
          - script.execute: start_wifi_setup_ap

script:
  - id: start_wifi_setup_ap
    mode: restart
    then:
      - logger.log:
          level: WARN
          format: "Starting forced Wi-Fi setup AP; normal STA config will return after reboot"
      - lambda: |-
          auto *wifi_comp = esphome::wifi::global_wifi_component;
          if (wifi_comp != nullptr) {
            wifi_comp->disable();
            wifi_comp->clear_sta();
            wifi_comp->set_ap_timeout(0);
            wifi_comp->enable();
          }

select:
  - platform: template
    id: outlet_startup_mode
    name: "Power Restore Mode"
    entity_category: config
    options:
      - "Always Off"
      - "Always On"
      - "Restore Last State"
    update_interval: 30s
    lambda: |-
      if (id(startup_mode_code) == 1)
        return std::string("Always On");
      if (id(startup_mode_code) == 2)
        return std::string("Restore Last State");
      return std::string("Always Off");
    set_action:
      - lambda: |-
          if (x == "Always On") {
            id(startup_mode_code) = 1;
          } else if (x == "Restore Last State") {
            id(startup_mode_code) = 2;
            id(last_outlet_state) = id(outlet_relay).state;
          } else {
            id(startup_mode_code) = 0;
          }
          id(outlet_startup_mode).publish_state(x);

globals:
  - id: startup_mode_code
    type: uint8_t
    restore_value: yes
    initial_value: '0'

  - id: last_outlet_state
    type: bool
    restore_value: yes
    initial_value: 'false'

  - id: boot_initializing
    type: bool
    restore_value: no
    initial_value: 'true'

  - id: voltage_coefficient
    type: double
    restore_value: yes
    initial_value: '322499.908463'

  - id: current_coefficient
    type: double
    restore_value: yes
    initial_value: '7516.962365203'

  - id: power_coefficient
    type: double
    restore_value: yes
    initial_value: '4618968.684198736'

  - id: energy_coefficient
    type: double
    restore_value: yes
    initial_value: '0.000001307873567336'

  - id: energy_total_raw
    type: uint64_t
    restore_value: no
    initial_value: '0'

  - id: energy_cal_raw
    type: uint64_t
    restore_value: no
    initial_value: '0'

  - id: average_power_raw
    type: uint64_t
    restore_value: no
    initial_value: '0'

  - id: average_power_window_start_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: current_zero_raw
    type: uint32_t
    restore_value: yes
    initial_value: '443876'

  - id: zero_cal_pending
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: zero_cal_count
    type: uint8_t
    restore_value: no
    initial_value: '0'

  - id: zero_cal_sum
    type: uint64_t
    restore_value: no
    initial_value: '0'

  - id: zero_cal_min
    type: uint32_t
    restore_value: no
    initial_value: '4294967295'

  - id: zero_cal_max
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: filtered_raw_v
    type: double
    restore_value: no
    initial_value: '0.0'

  - id: filtered_raw_i
    type: double
    restore_value: no
    initial_value: '0.0'

  - id: filtered_raw_w
    type: double
    restore_value: no
    initial_value: '0.0'

  - id: filtered_voltage
    type: double
    restore_value: no
    initial_value: '0.0'

  - id: filtered_current
    type: double
    restore_value: no
    initial_value: '0.0'

  - id: filtered_power
    type: double
    restore_value: no
    initial_value: '0.0'

  - id: filter_sample_count
    type: uint8_t
    restore_value: no
    initial_value: '0'

  - id: raw_v_history
    type: double[5]
    restore_value: no
    initial_value: '{0,0,0,0,0}'

  - id: raw_i_history
    type: double[5]
    restore_value: no
    initial_value: '{0,0,0,0,0}'

  - id: raw_w_history
    type: double[5]
    restore_value: no
    initial_value: '{0,0,0,0,0}'

