    internal: true
    update_interval: never

  - platform: template
    id: raw_frame
    name: "Diagnostic - Raw Frame"
    internal: true
    update_interval: never

  - platform: template
    id: zero_calibration_status
    name: "Calibration - Zero Status"
    internal: true
    update_interval: never

  - platform: template
    id: calibration_status
    name: "Calibration - Status"
    internal: true
    update_interval: never

number:
  - platform: template
    id: reference_voltage
    name: "Calibration - Voltage Reference"
    internal: true
    unit_of_measurement: "V"
    optimistic: true
    restore_value: false
    initial_value: 120.0
    min_value: 80.0
    max_value: 140.0
    step: 0.1
    mode: box

  - platform: template
    id: reference_current
    name: "Calibration - Current Reference"
    internal: true
    unit_of_measurement: "A"
    optimistic: true
    restore_value: false
    initial_value: 1.000
    min_value: 0.010
    max_value: 20.000
    step: 0.001
    mode: box

  - platform: template
    id: reference_power
    name: "Calibration - Power Reference"
    internal: true
    unit_of_measurement: "W"
    optimistic: true
    restore_value: false
    initial_value: 100.0
    min_value: 1.0
    max_value: 2000.0
    step: 0.1
    mode: box

  - platform: template
    id: reference_energy
    name: "Calibration - Energy Reference"
    internal: true
    unit_of_measurement: "kWh"
    optimistic: true
    restore_value: false
    initial_value: 0.100
    min_value: 0.001
    max_value: 10.000
    step: 0.001
    mode: box

button:
  - platform: template
    id: start_wifi_setup_button
    name: "Start Wi-Fi Setup AP"
    internal: true
    on_press:
      - script.execute: start_wifi_setup_ap

  - platform: template
    id: calibrate_zero_button
    name: "Calibration - Zero Calibrate"
    internal: true
    on_press:
      - if:
          condition:
            switch.is_off: outlet_relay
          then:
            - lambda: |-
                id(zero_cal_pending) = true;
                id(zero_cal_count) = 0;
                id(zero_cal_sum) = 0;
                id(zero_cal_min) = 0xFFFFFFFFUL;
                id(zero_cal_max) = 0;
                id(zero_calibration_status).publish_state("Collecting zero: 0/5 valid frames");
          else:
            - text_sensor.template.publish:
                id: zero_calibration_status
                state: "Outlet must be OFF"

  - platform: template
    id: calibrate_voltage_button
    name: "Calibration - Voltage Calibrate"
    internal: true
    on_press:
      - lambda: |-
          const float ref = id(reference_voltage).state;
          if (isnan(ref) || ref <= 0.0f || id(filtered_raw_v) <= 0.0) {
            id(calibration_status).publish_state("Voltage calibration failed");
            return;
          }
          id(voltage_coefficient) = (double) ref * id(filtered_raw_v);
          id(calibration_status).publish_state("Voltage calibrated");

  - platform: template
    id: calibrate_current_button
    name: "Calibration - Current Calibrate"
    internal: true
    on_press:
      - lambda: |-
          const float ref = id(reference_current).state;
          const double raw_i = id(filtered_raw_i);
          const double raw_zero = (double) id(current_zero_raw);
          const double denom = (1.0 / raw_i) - (1.0 / raw_zero);
          if (isnan(ref) || ref <= 0.0f || raw_i <= 0.0 || raw_zero <= 0.0 || denom <= 0.0) {
            id(calibration_status).publish_state("Current calibration failed");
            return;
          }
          id(current_coefficient) = (double) ref / denom;
          id(calibration_status).publish_state("Current calibrated");

  - platform: template
    id: calibrate_power_button
    name: "Calibration - Power Calibrate"
    internal: true
    on_press:
      - lambda: |-
          const float ref = id(reference_power).state;
          if (isnan(ref) || ref <= 0.0f || id(filtered_raw_w) <= 0.0) {
            id(calibration_status).publish_state("Power calibration failed");
            return;
          }
          id(power_coefficient) = (double) ref * id(filtered_raw_w);
          id(calibration_status).publish_state("Power calibrated");

  - platform: template
    id: reset_energy_calibration_button
    name: "Calibration - Energy Reset Run"
    internal: true
    on_press:
      - lambda: |-
          id(energy_cal_raw) = 0;
          id(energy_calibration_run).publish_state(0.0f);
          id(calibration_status).publish_state("Energy calibration run reset");

  - platform: template
    id: calibrate_energy_button
    name: "Calibration - Energy Calibrate"
    internal: true
    on_press:
      - lambda: |-
          const float ref = id(reference_energy).state;
          if (isnan(ref) || ref <= 0.0f || id(energy_cal_raw) == 0) {
            id(calibration_status).publish_state("Energy calibration failed");
            return;
          }
          id(energy_coefficient) = (double) ref / (double) id(energy_cal_raw);
          id(calibration_status).publish_state("Energy calibrated");

  - platform: template
    id: reset_calibration_button
    name: "Calibration - Reset Defaults"
    internal: true
    on_press:
      - lambda: |-
          id(voltage_coefficient) = 322499.908463;
          id(current_coefficient) = 7516.962365203;
          id(power_coefficient) = 4618968.684198736;
          id(energy_coefficient) = 0.000001307873567336;
          id(current_zero_raw) = 443876;
          id(calibration_status).publish_state("Calibration reset to reference defaults");

interval:
  - interval: 5s
    then:
      - lambda: |-
          WionPowerFrame f = wion_read_power_frame();

          char frame_buf[128];
          snprintf(frame_buf, sizeof(frame_buf),
                   "%08lX %08lX %08lX %08lX",
                   (unsigned long) f.words[0],
                   (unsigned long) f.words[1],
                   (unsigned long) f.words[2],
                   (unsigned long) f.words[3]);
          id(raw_frame).publish_state(frame_buf);

          if (!f.valid) {
            id(frame_status).publish_state("INVALID");
            return;
          }

          id(frame_status).publish_state("OK");
          id(raw_h).publish_state((float) f.h);
          id(raw_i).publish_state((float) f.i);
          id(raw_w).publish_state((float) f.w);
          id(raw_v).publish_state((float) f.v);

          // Direct raw-domain conversion.
          // Guard thresholds are retained from the verified bridge behavior.
          double volts = NAN;
          double amps = NAN;
          double watts = NAN;

          if (f.v >= 1000)
            volts = id(voltage_coefficient) / (double) f.v;

          if (!id(outlet_relay).state) {
            amps = 0.0;
            watts = 0.0;
          } else {
            if (f.i >= 362 && id(current_zero_raw) > 0) {
              amps = id(current_coefficient) *
                     ((1.0 / (double) f.i) -
                      (1.0 / (double) id(current_zero_raw)));
              if (amps < 0.0)
                amps = 0.0;
            }

            if (f.w >= 1723)
              watts = id(power_coefficient) / (double) f.w;
            else if (f.w == 0)
              watts = 0.0;
          }

          id(voltage).publish_state((float) volts);
          id(current).publish_state((float) amps);
          id(power).publish_state((float) watts);

          id(filtered_raw_v) = (double) f.v;
          id(filtered_raw_i) = (double) f.i;
          id(filtered_raw_w) = (double) f.w;
          id(filtered_voltage) = volts;
          id(filtered_current) = amps;
          id(filtered_power) = watts;
          id(filter_sample_count) = 1;

          id(filtered_raw_v_display).publish_state((float) id(filtered_raw_v));
          id(filtered_raw_i_display).publish_state((float) id(filtered_raw_i));
          id(filtered_raw_w_display).publish_state((float) id(filtered_raw_w));

          if (id(zero_cal_pending) && !id(outlet_relay).state) {
            id(zero_cal_sum) += (uint64_t) f.i;
            if (f.i < id(zero_cal_min))
              id(zero_cal_min) = f.i;
            if (f.i > id(zero_cal_max))
              id(zero_cal_max) = f.i;
            id(zero_cal_count)++;

            char status_buf[64];
            snprintf(status_buf, sizeof(status_buf),
                     "Collecting zero: %u/5 valid frames",
                     (unsigned) id(zero_cal_count));
            id(zero_calibration_status).publish_state(status_buf);

            if (id(zero_cal_count) >= 5) {
              const uint32_t spread = id(zero_cal_max) - id(zero_cal_min);
              const uint32_t average =
                  (uint32_t) (id(zero_cal_sum) / id(zero_cal_count));

              if (spread <= 50000UL) {
                id(current_zero_raw) = average;
                id(current_zero_raw_display).publish_state((float) average);
                id(zero_calibration_status).publish_state("Zero calibrated");
              } else {
                id(zero_calibration_status).publish_state("Zero unstable; retry");
              }

              id(zero_cal_pending) = false;
            }
          }

          id(current_zero_raw_display).publish_state((float) id(current_zero_raw));
          id(voltage_coefficient_display).publish_state((float) id(voltage_coefficient));
          id(current_coefficient_display).publish_state((float) id(current_coefficient));
          id(power_coefficient_display).publish_state((float) id(power_coefficient));
          id(energy_coefficient_display).publish_state((float) id(energy_coefficient));

          float va = NAN;
          float pf = NAN;
          if (!isnan(volts) && !isnan(amps)) {
            va = volts * amps;
            if (va >= 5.0f && !isnan(watts)) {
              pf = watts / va;
              if (pf < 0.0f)
                pf = 0.0f;
              if (pf > 1.0f)
                pf = 1.0f;
            }
          }

          id(apparent_power).publish_state(va);
          id(power_factor).publish_state(pf);

          id(energy_total_raw) += (uint64_t) f.h;
          id(energy_cal_raw) += (uint64_t) f.h;
          id(average_power_raw) += (uint64_t) f.h;

          const double energy_kwh =
              (double) id(energy_total_raw) * id(energy_coefficient);
          id(energy).publish_state((float) energy_kwh);

          const double calibration_run_kwh =
              (double) id(energy_cal_raw) * id(energy_coefficient);
          id(energy_calibration_run).publish_state((float) calibration_run_kwh);

          const uint32_t now_ms = millis();
          if (id(average_power_window_start_ms) == 0) {
            id(average_power_window_start_ms) = now_ms;
            id(average_power_raw) = 0;
          } else {
            const uint32_t elapsed_ms =
                (uint32_t) (now_ms - id(average_power_window_start_ms));

            if (elapsed_ms >= 60000U) {
              const double window_kwh =
                  (double) id(average_power_raw) * id(energy_coefficient);
              const double elapsed_s = (double) elapsed_ms / 1000.0;
              const double avg_w =
                  (elapsed_s > 0.0)
                  ? (window_kwh * 3600000.0 / elapsed_s)
                  : 0.0;

              id(average_power).publish_state((float) avg_w);
              id(average_power_raw) = 0;
              id(average_power_window_start_ms) = now_ms;
            }
          }
