substitutions:
  device_name: wion-50055
  friendly_name: "WiOn 50055"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: "WiOn v1.1.0 firmware for Woods WiOn 50055"
  min_version: 2026.8.2
  includes:
    - wion_power_bridge.h

  on_boot:
    - priority: 600
      then:
        - lambda: |-
            wion_bus_setup();

    # Apply the user-selected outlet startup policy only after components and
    # restored preferences are available. The relay itself always initializes
    # physically OFF first, preventing an early ON pulse.
    - priority: -100
      then:
        - lambda: |-
            bool desired = false;
            if (id(startup_mode_code) == 1) {
              desired = true;                       // Always On
            } else if (id(startup_mode_code) == 2) {
              desired = id(last_outlet_state);      // Restore Last State
            }

            if (desired) {
              id(outlet_relay).turn_on();
            } else {
              id(outlet_relay).turn_off();
            }

            id(boot_initializing) = false;

            const String rr = ESP.getResetReason();
            const String ri = ESP.getResetInfo();

            id(reset_reason).publish_state(rr.c_str());
            id(reset_info).publish_state(ri.c_str());

            ESP_LOGI("wion.boot", "Reset reason: %s", rr.c_str());
            ESP_LOGW("wion.boot", "Reset info: %s", ri.c_str());

esp8266:
  board: esp01_1m
  # Persist only ESPHome preferences that explicitly request restore_value.
  # Energy / average-power accumulators below remain RAM-only.
  restore_from_flash: true

# Persist explicit user changes immediately.  No periodic energy checkpointing
# is used, so flash writes are limited to calibration/settings and, when
# selected, outlet-state changes for "Restore Last State".
preferences:
  flash_write_interval: 1s

logger:
  level: DEBUG
  baud_rate: 0

# -----------------------------------------------------------------------------
# Network / recovery
# -----------------------------------------------------------------------------

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2
  power_save_mode: none
  reboot_timeout: 0s

  ap:
    ssid: "WiOn-50055 Setup"
    password: !secret fallback_ap_password
    ap_timeout: 90s

  on_connect:
    - output.turn_on: blue_led_output
  on_disconnect:
    - output.turn_off: blue_led_output

captive_portal:

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

safe_mode:
  num_attempts: 5
  boot_is_good_after: 1min
  reboot_timeout: 10min
  storage: rtc

web_server:
  port: 80
  version: 2
  log: true
  include_internal: true
  auth:
    type: digest
    username: !secret web_username
    password: !secret web_password

# -----------------------------------------------------------------------------
# Hardware I/O
# -----------------------------------------------------------------------------

output:
  - platform: gpio
    id: blue_led_output
    pin:
      number: GPIO2
      inverted: true

switch:
  - platform: gpio
    id: outlet_relay
    name: "Outlet"
    pin: GPIO15
    restore_mode: ALWAYS_OFF

    on_turn_on:
      - lambda: |-
          if (!id(boot_initializing) && id(startup_mode_code) == 2)
            id(last_outlet_state) = true;

          if (id(zero_cal_pending)) {
            id(zero_cal_pending) = false;
            id(zero_calibration_status).publish_state("Cancelled: outlet turned ON");
            ESP_LOGW("wion", "Zero calibration cancelled because outlet was turned ON");
          }

    on_turn_off:
      - lambda: |-
          if (!id(boot_initializing) && id(startup_mode_code) == 2)
            id(last_outlet_state) = false;

  - platform: gpio
    id: outlet_backlight
    name: "Outlet Backlight"
    pin: GPIO14
    restore_mode: RESTORE_DEFAULT_OFF

binary_sensor:
  - platform: gpio
    id: physical_button
    name: "Physical Button"
    internal: true
    pin:
      number: GPIO13
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on_off: 20ms

    on_multi_click:
      # Normal short press: toggle the outlet.
      - timing:
          - ON for at most 1s
          - OFF for at least 50ms
        then:
          - switch.toggle: outlet_relay

      # Service action: hold for 30 s to force the password-protected setup AP.
      - timing:
          - ON for at least 30s
        then:
          - script.execute: start_wifi_setup_ap

# -----------------------------------------------------------------------------
# Wi-Fi setup AP action
# -----------------------------------------------------------------------------

script:
  - id: start_wifi_setup_ap
    mode: restart
    then:
      - logger.log:
          level: WARN
          format: "Starting forced Wi-Fi setup AP; normal STA config will return after reboot"
      - lambda: |-
          auto *wifi_comp = esphome::wifi::global_wifi_component;
          if (wifi_comp != nullptr) {
            // Runtime-only change: the compiled STA credentials remain intact
            // and are restored on the next reboot. With no STA configured and
            // a fallback AP present, ESPHome starts AP-only + captive portal.
            wifi_comp->disable();
            wifi_comp->clear_sta();
            wifi_comp->set_ap_timeout(0);
            wifi_comp->enable();
          }

# -----------------------------------------------------------------------------
# Outlet startup mode
# -----------------------------------------------------------------------------

select:
  - platform: template
    id: outlet_startup_mode
    name: "Power Restore Mode"
    entity_category: config
    options:
      - "Always Off"
      - "Always On"
      - "Restore Last State"
    update_interval: 30s
    lambda: |-
      if (id(startup_mode_code) == 1)
        return std::string("Always On");
      if (id(startup_mode_code) == 2)
        return std::string("Restore Last State");
      return std::string("Always Off");
    set_action:
      - lambda: |-
          if (x == "Always On") {
            id(startup_mode_code) = 1;
          } else if (x == "Restore Last State") {
            id(startup_mode_code) = 2;
            id(last_outlet_state) = id(outlet_relay).state;
          } else {
            id(startup_mode_code) = 0;
          }
          id(outlet_startup_mode).publish_state(x);

# -----------------------------------------------------------------------------
# Persistent runtime state
# -----------------------------------------------------------------------------

globals:
  # Startup behavior: 0=Always Off, 1=Always On, 2=Restore Last State.
  - id: startup_mode_code
    type: uint8_t
    restore_value: yes
    initial_value: '0'

  - id: last_outlet_state
    type: bool
    restore_value: yes
    initial_value: 'false'

  - id: boot_initializing
    type: bool
    restore_value: no
    initial_value: 'true'

  # Direct raw-domain calibration coefficients.
  #
  # Reference defaults measured on the development unit. They provide
  # usable readings on a fresh install and can be refined from the local web UI.
  - id: voltage_coefficient
    type: double
    restore_value: yes
    initial_value: '322499.908463'

  - id: current_coefficient
    type: double
    restore_value: yes
    initial_value: '7516.962365203'

  - id: power_coefficient
    type: double
    restore_value: yes
    initial_value: '4618968.684198736'

  # kWh per one Raw-H count.
  - id: energy_coefficient
    type: double
    restore_value: yes
    initial_value: '0.000001307873567336'

  # Main HA energy counter: deliberately RAM-only. It resets on device reboot;
  # state_class=total_increasing lets HA account for such resets correctly.
  - id: energy_total_raw
    type: uint64_t
    restore_value: no
    initial_value: '0'

  # Separate raw accumulator used only when calibrating energy.
  - id: energy_cal_raw
    type: uint64_t
    restore_value: no
    initial_value: '0'

  # 60-second active-power estimator derived from the H/energy channel.
  # This remains RAM-only and exists specifically to resolve very small loads
  # that the instantaneous W channel reports as zero.
  - id: average_power_raw
    type: uint64_t
    restore_value: no
    initial_value: '0'

  - id: average_power_window_start_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  # Persisted raw no-load current point used directly in the current equation.
  - id: current_zero_raw
    type: uint32_t
    restore_value: yes
    initial_value: '443876'

  - id: zero_cal_pending
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: zero_cal_count
    type: uint8_t
    restore_value: no
    initial_value: '0'

  - id: zero_cal_sum
    type: uint64_t
    restore_value: no
    initial_value: '0'

  - id: zero_cal_min
    type: uint32_t
    restore_value: no
    initial_value: '4294967295'

  - id: zero_cal_max
    type: uint32_t
    restore_value: no
    initial_value: '0'

  # -------------------------------------------------------------------------
  # Measurement smoothing (RAM only)
  #
  # The bridge has visibly quantized/noisy instantaneous readings. Keep the
  # original raw diagnostics untouched, but use a 3-sample median followed by
  # an EMA (alpha 0.25) for the normal V/I/W measurements.
  # -------------------------------------------------------------------------

  - id: filter_sample_count
    type: uint8_t
    restore_value: no
    initial_value: '0'

  - id: filter_v_1
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: filter_v_2
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: filter_v_3
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: filter_i_1
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: filter_i_2
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: filter_i_3
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: filter_w_1
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: filter_w_2
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: filter_w_3
    type: uint32_t
    restore_value: no
    initial_value: '0'

  # EMA-smoothed raw values are used by calibration.
  - id: filtered_raw_v
    type: double
    restore_value: no
    initial_value: '0.0'
  - id: filtered_raw_i
    type: double
    restore_value: no
    initial_value: '0.0'
  - id: filtered_raw_w
    type: double
    restore_value: no
    initial_value: '0.0'

  # EMA-smoothed physical values are published to HA/web.
  - id: filtered_voltage
    type: double
    restore_value: no
    initial_value: '0.0'
  - id: filtered_current
    type: double
    restore_value: no
    initial_value: '0.0'
  - id: filtered_power
    type: double
    restore_value: no
    initial_value: '0.0'

  # Publish normal V/I/W/S/PF every second bridge frame (~10 s).
  - id: measurement_publish_counter
    type: uint8_t
    restore_value: no
    initial_value: '0'

# -----------------------------------------------------------------------------
# Home Assistant: normal user-facing measurements
# -----------------------------------------------------------------------------

sensor:
  - platform: template
    id: voltage
    name: "Voltage"
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    update_interval: never

  - platform: template
    id: current
    name: "Current"
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 3
    update_interval: never

  - platform: template
    id: power
    name: "Power"
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 1
    update_interval: never

  - platform: template
    id: average_power
    name: "Average Power"
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 1
    update_interval: never

  - platform: template
    id: apparent_power
    name: "Apparent Power"
    unit_of_measurement: "VA"
    state_class: measurement
    accuracy_decimals: 1
    update_interval: never

  - platform: template
    id: power_factor
    name: "Power Factor"
    state_class: measurement
    accuracy_decimals: 2
    update_interval: never

  - platform: template
    id: energy
    name: "Energy"
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 4
    update_interval: never

  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
    accuracy_decimals: 0
    entity_category: diagnostic

  - platform: uptime
    name: "Uptime"
    update_interval: 60s
    entity_category: diagnostic

  # Temporary runtime diagnostics for tracking crashes / heap fragmentation.
  - platform: template
    name: "Diagnostic - Free Heap"
    unit_of_measurement: "B"
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      return (float) ESP.getFreeHeap();

  - platform: template
    name: "Diagnostic - Max Free Heap Block"
    unit_of_measurement: "B"
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      return (float) ESP.getMaxFreeBlockSize();

  - platform: template
    name: "Diagnostic - Heap Fragmentation"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      return (float) ESP.getHeapFragmentation();

  # Raw no-load current point and the effective calibration coefficients.
  # These are service/read-only values and remain hidden from Home Assistant.
  - platform: template
    id: current_zero_raw_display
    name: "Calibration - Current Zero Raw"
    internal: true
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    id: voltage_coefficient_display
    name: "Calibration - Voltage Coefficient"
    internal: true
    accuracy_decimals: 6
    update_interval: never

  - platform: template
    id: current_coefficient_display
    name: "Calibration - Current Coefficient"
    internal: true
    accuracy_decimals: 6
    update_interval: never

  - platform: template
    id: power_coefficient_display
    name: "Calibration - Power Coefficient"
    internal: true
    accuracy_decimals: 6
    update_interval: never

  - platform: template
    id: energy_coefficient_display
    name: "Calibration - Energy Coefficient"
    internal: true
    accuracy_decimals: 12
    update_interval: never

  # ---------------------------------------------------------------------------
  # Local web UI only: diagnostics / service data
  # ---------------------------------------------------------------------------

  - platform: template
    id: raw_h
    name: "Diagnostic - Raw H"
    internal: true
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    id: raw_i
    name: "Diagnostic - Raw I"
    internal: true
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    id: raw_w
    name: "Diagnostic - Raw W"
    internal: true
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    id: raw_v
    name: "Diagnostic - Raw V"
    internal: true
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    id: filtered_raw_v_display
    name: "Diagnostic - Filtered Raw V"
    internal: true
    accuracy_decimals: 1
    update_interval: never

  - platform: template
    id: filtered_raw_i_display
    name: "Diagnostic - Filtered Raw I"
    internal: true
    accuracy_decimals: 1
    update_interval: never

  - platform: template
    id: filtered_raw_w_display
    name: "Diagnostic - Filtered Raw W"
    internal: true
    accuracy_decimals: 1
    update_interval: never

  - platform: template
    id: energy_calibration_run
    name: "Calibration - Energy Run"
    internal: true
    unit_of_measurement: "kWh"
    accuracy_decimals: 4
    update_interval: never

text_sensor:
  - platform: template
    id: reset_reason
    name: "Reset Reason"
    entity_category: diagnostic
    update_interval: never

  - platform: template
    id: reset_info
    name: "Diagnostic - Reset Info"
    entity_category: diagnostic
    update_interval: never

  - platform: template
    id: frame_status
    name: "Diagnostic - Frame Status"
    internal: true
    update_interval: never

  - platform: template
    id: raw_frame
    name: "Diagnostic - Raw Frame"
    internal: true
    update_interval: never

  - platform: template
    id: zero_calibration_status
    name: "Calibration - Zero Status"
    internal: true
    update_interval: never

  - platform: template
    id: calibration_status
    name: "Calibration - Status"
    internal: true
    update_interval: never

# -----------------------------------------------------------------------------
# Local web UI only: reference-value calibration inputs
# -----------------------------------------------------------------------------

number:
  - platform: template
    id: reference_voltage
    name: "Calibration - Voltage Reference"
    internal: true
    unit_of_measurement: "V"
    optimistic: true
    restore_value: false
    initial_value: 120.0
    min_value: 80.0
    max_value: 140.0
    step: 0.1
    mode: box

  - platform: template
    id: reference_current
    name: "Calibration - Current Reference"
    internal: true
    unit_of_measurement: "A"
    optimistic: true
    restore_value: false
    initial_value: 1.000
    min_value: 0.010
    max_value: 20.000
    step: 0.001
    mode: box

  - platform: template
    id: reference_power
    name: "Calibration - Power Reference"
    internal: true
    unit_of_measurement: "W"
    optimistic: true
    restore_value: false
    initial_value: 100.0
    min_value: 1.0
    max_value: 2000.0
    step: 0.1
    mode: box

  - platform: template
    id: reference_energy
    name: "Calibration - Energy Reference"
    internal: true
    unit_of_measurement: "kWh"
    optimistic: true
    restore_value: false
    initial_value: 0.100
    min_value: 0.001
    max_value: 10.000
    step: 0.001
    mode: box

# -----------------------------------------------------------------------------
# Local web UI only: service / calibration actions
# -----------------------------------------------------------------------------

button:
  - platform: template
    id: start_wifi_setup_button
    name: "Start Wi-Fi Setup AP"
    internal: true
    on_press:
      - script.execute: start_wifi_setup_ap

  - platform: template
    id: calibrate_zero_button
    name: "Calibration - Zero Calibrate"
    internal: true
    on_press:
      - if:
          condition:
            switch.is_off: outlet_relay
          then:
            - lambda: |-
                id(zero_cal_pending) = true;
                id(zero_cal_count) = 0;
                id(zero_cal_sum) = 0;
                id(zero_cal_min) = 0xFFFFFFFFUL;
                id(zero_cal_max) = 0;
                id(zero_calibration_status).publish_state("Collecting zero: 0/5 valid frames");
                ESP_LOGI("wion", "Zero calibration started: collecting 5 valid no-load frames");
          else:
            - text_sensor.template.publish:
                id: zero_calibration_status
                state: "Outlet must be OFF"

  - platform: template
    name: "Calibration - Voltage Calibrate"
    internal: true
    on_press:
      - lambda: |-
          const double raw_v_value = id(filtered_raw_v);
          const double ref_v = (double) id(reference_voltage).state;

          if (!isnan(raw_v_value) && raw_v_value > 0.0 && ref_v > 1.0) {
            id(voltage_coefficient) = ref_v * raw_v_value;
            id(filtered_voltage) = ref_v;

            char msg[112];
            snprintf(msg, sizeof(msg),
                     "Voltage: RawV=%.0f, ref=%.2f V, K_V=%.6f",
                     raw_v_value, ref_v, id(voltage_coefficient));
            id(calibration_status).publish_state(msg);
            ESP_LOGI("wion.cal", "%s", msg);
          } else {
            id(calibration_status).publish_state("Voltage calibration failed: no valid raw measurement");
          }

  - platform: template
    name: "Calibration - Current Calibrate"
    internal: true
    on_press:
      - lambda: |-
          const double raw_i_value = id(filtered_raw_i);
          const double raw_i0 = (double) id(current_zero_raw);
          const double ref_i = (double) id(reference_current).state;

          if (id(outlet_relay).state &&
              raw_i_value > 0.0 &&
              raw_i0 > 0.0 &&
              raw_i_value < raw_i0 &&
              ref_i > 0.0) {
            const double denominator = (1.0 / raw_i_value) - (1.0 / raw_i0);

            if (denominator > 0.0) {
              id(current_coefficient) = ref_i / denominator;
              id(filtered_current) = ref_i;

              char msg[128];
              snprintf(msg, sizeof(msg),
                       "Current: RawI=%.0f, RawI0=%.0f, ref=%.4f A, K_I=%.6f",
                       raw_i_value, raw_i0, ref_i, id(current_coefficient));
              id(calibration_status).publish_state(msg);
              ESP_LOGI("wion.cal", "%s", msg);
            } else {
              id(calibration_status).publish_state("Current calibration failed: invalid raw delta");
            }
          } else {
            id(calibration_status).publish_state("Current calibration failed: zero-calibrate and apply a load");
          }

  - platform: template
    name: "Calibration - Power Calibrate"
    internal: true
    on_press:
      - lambda: |-
          const double raw_w_value = id(filtered_raw_w);
          const double ref_w = (double) id(reference_power).state;

          if (id(outlet_relay).state && raw_w_value > 0.0 && ref_w > 0.0) {
            id(power_coefficient) = ref_w * raw_w_value;
            id(filtered_power) = ref_w;

            char msg[112];
            snprintf(msg, sizeof(msg),
                     "Power: RawW=%.0f, ref=%.2f W, K_P=%.6f",
                     raw_w_value, ref_w, id(power_coefficient));
            id(calibration_status).publish_state(msg);
            ESP_LOGI("wion.cal", "%s", msg);
          } else {
            id(calibration_status).publish_state("Power calibration failed: apply a load first");
          }

  - platform: template
    name: "Calibration - Energy Reset Run"
    internal: true
    on_press:
      - lambda: |-
          id(energy_cal_raw) = 0;
          id(energy_calibration_run).publish_state(0.0f);
          id(calibration_status).publish_state("Energy calibration run reset");

  - platform: template
    name: "Calibration - Energy Calibrate"
    internal: true
    on_press:
      - lambda: |-
          const uint64_t raw_h_sum = id(energy_cal_raw);
          const double ref_e = (double) id(reference_energy).state;

          if (raw_h_sum > 0 && ref_e > 0.0) {
            id(energy_coefficient) = ref_e / (double) raw_h_sum;

            // Avoid an artificial jump in the HA total_increasing counter when
            // the coefficient changes: begin a new boot-cycle total.
            id(energy_total_raw) = 0;
            id(energy_cal_raw) = 0;
            id(average_power_raw) = 0;
            id(average_power_window_start_ms) = millis();
            id(energy).publish_state(0.0f);
            id(average_power).publish_state(NAN);
            id(energy_calibration_run).publish_state(0.0f);

            char msg[128];
            snprintf(msg, sizeof(msg),
                     "Energy: RawH=%llu, ref=%.5f kWh, K_E=%.12f",
                     (unsigned long long) raw_h_sum,
                     ref_e,
                     id(energy_coefficient));
            id(calibration_status).publish_state(msg);
            ESP_LOGI("wion.cal", "%s", msg);
          } else {
            id(calibration_status).publish_state("Energy calibration failed: accumulate energy first");
          }

  - platform: template
    name: "Calibration - Reset Defaults"
    internal: true
    on_press:
      - lambda: |-
          id(voltage_coefficient) = 322499.908463;
          id(current_coefficient) = 7516.962365203;
          id(power_coefficient) = 4618968.684198736;
          id(energy_coefficient) = 0.000001307873567336;

          // Final known-good no-load raw point from the development unit.
          id(current_zero_raw) = 443876;
          id(zero_cal_pending) = false;

          if (id(filtered_raw_v) > 0.0)
            id(filtered_voltage) =
                id(voltage_coefficient) / id(filtered_raw_v);

          if (id(filtered_raw_i) > 0.0) {
            double a =
                id(current_coefficient) *
                ((1.0 / id(filtered_raw_i)) -
                 (1.0 / (double) id(current_zero_raw)));
            if (a < 0.0)
              a = 0.0;
            id(filtered_current) = a;
          }

          if (id(filtered_raw_w) > 0.0)
            id(filtered_power) =
                id(power_coefficient) / id(filtered_raw_w);
          else
            id(filtered_power) = 0.0;

          id(average_power_raw) = 0;
          id(average_power_window_start_ms) = millis();
          id(average_power).publish_state(NAN);

          id(zero_calibration_status).publish_state("Default Raw I0=443876 restored");
          id(calibration_status).publish_state("Calibration reset to reference defaults");
          ESP_LOGI("wion.cal",
                   "Defaults: K_V=%.6f K_I=%.6f K_P=%.6f K_E=%.12f RawI0=%lu",
                   id(voltage_coefficient),
                   id(current_coefficient),
                   id(power_coefficient),
                   id(energy_coefficient),
                   (unsigned long) id(current_zero_raw));

# -----------------------------------------------------------------------------
# Stock bridge reader
# -----------------------------------------------------------------------------

interval:
  - interval: 5s
    then:
      - lambda: |-
          // v1.1 converts the stock bridge raw values directly with the
          // persisted raw-domain calibration coefficients.

          const WionPowerFrame f = wion_read_power_frame();

          char packet[64];
          snprintf(packet, sizeof(packet), "%08lX %08lX %08lX %08lX",
                   (unsigned long) f.words[0],
                   (unsigned long) f.words[1],
                   (unsigned long) f.words[2],
                   (unsigned long) f.words[3]);

          if (!f.valid) {
            const bool all_ff =
                f.words[0] == 0xFFFFFFFFUL &&
                f.words[1] == 0xFFFFFFFFUL &&
                f.words[2] == 0xFFFFFFFFUL &&
                f.words[3] == 0xFFFFFFFFUL;

            if (!all_ff) {
              id(frame_status).publish_state("BAD TAGS");
              id(raw_frame).publish_state(packet);
              ESP_LOGW("wion", "Bad frame: %s", packet);
            } else {
              ESP_LOGV("wion", "Bridge not ready; keeping previous values");
            }
            return;
          }

          id(frame_status).publish_state("OK");
          id(raw_frame).publish_state(packet);
          id(raw_h).publish_state((float) f.h);
          id(raw_i).publish_state((float) f.i);
          id(raw_w).publish_state((float) f.w);
          id(raw_v).publish_state((float) f.v);

          // Zero calibration: five valid no-load frames, trimmed mean.
          if (id(zero_cal_pending)) {
            if (id(outlet_relay).state) {
              id(zero_cal_pending) = false;
              id(zero_calibration_status).publish_state("Cancelled: outlet is ON");
            } else if (f.i > 0 && f.w == 0) {
              id(zero_cal_sum) += (uint64_t) f.i;
              if (f.i < id(zero_cal_min))
                id(zero_cal_min) = f.i;
              if (f.i > id(zero_cal_max))
                id(zero_cal_max) = f.i;
              id(zero_cal_count)++;

              char progress[48];
              snprintf(progress, sizeof(progress), "Collecting zero: %u/5 valid frames",
                       (unsigned) id(zero_cal_count));
              id(zero_calibration_status).publish_state(progress);

              if (id(zero_cal_count) >= 5) {
                const uint64_t trimmed_sum =
                    id(zero_cal_sum) -
                    (uint64_t) id(zero_cal_min) -
                    (uint64_t) id(zero_cal_max);
                const uint32_t raw_zero = (uint32_t) (trimmed_sum / 3ULL);

                id(current_zero_raw) = raw_zero;
                id(zero_cal_pending) = false;

                char msg[64];
                snprintf(msg, sizeof(msg), "OK: Raw I0=%lu",
                         (unsigned long) raw_zero);
                id(zero_calibration_status).publish_state(msg);
                ESP_LOGI("wion", "Zero calibrated: RawI0=%lu",
                         (unsigned long) raw_zero);
              }
            }
          }

          // ---------------------------------------------------------------
          // Smoothing:
          //   bridge frame every 5 s
          //   3-sample median prefilter
          //   EMA alpha = 0.25
          //
          // Raw diagnostics above remain completely unfiltered.
          // ---------------------------------------------------------------
          constexpr double FILTER_ALPHA = 0.25;

          auto median3 = [](uint32_t a, uint32_t b, uint32_t c) -> double {
            if (a > b) {
              const uint32_t t = a;
              a = b;
              b = t;
            }
            if (b > c) {
              const uint32_t t = b;
              b = c;
              c = t;
            }
            if (a > b) {
              const uint32_t t = a;
              a = b;
              b = t;
            }
            return (double) b;
          };

          // Shift the last three valid bridge readings.
          id(filter_v_3) = id(filter_v_2);
          id(filter_v_2) = id(filter_v_1);
          id(filter_v_1) = f.v;

          id(filter_i_3) = id(filter_i_2);
          id(filter_i_2) = id(filter_i_1);
          id(filter_i_1) = f.i;

          id(filter_w_3) = id(filter_w_2);
          id(filter_w_2) = id(filter_w_1);
          id(filter_w_1) = f.w;

          if (id(filter_sample_count) < 3)
            id(filter_sample_count)++;

          double median_raw_v = (double) f.v;
          double median_raw_i = (double) f.i;
          double median_raw_w = (double) f.w;

          if (id(filter_sample_count) == 2) {
            median_raw_v =
                ((double) id(filter_v_1) + (double) id(filter_v_2)) / 2.0;
            median_raw_i =
                ((double) id(filter_i_1) + (double) id(filter_i_2)) / 2.0;
            median_raw_w =
                ((double) id(filter_w_1) + (double) id(filter_w_2)) / 2.0;
          } else if (id(filter_sample_count) >= 3) {
            median_raw_v =
                median3(id(filter_v_1), id(filter_v_2), id(filter_v_3));
            median_raw_i =
                median3(id(filter_i_1), id(filter_i_2), id(filter_i_3));
            median_raw_w =
                median3(id(filter_w_1), id(filter_w_2), id(filter_w_3));
          }

          // Instantaneous physical values are used only for large-step
          // detection. Normal published values come from the filtered path.
          double instant_a = NAN;
          if (!id(outlet_relay).state) {
            instant_a = 0.0;
          } else if (f.i >= 362 && id(current_zero_raw) > 0) {
            instant_a =
                id(current_coefficient) *
                ((1.0 / (double) f.i) -
                 (1.0 / (double) id(current_zero_raw)));
            if (instant_a < 0.0)
              instant_a = 0.0;
          }

          double instant_w = NAN;
          if (!id(outlet_relay).state || f.w == 0) {
            instant_w = 0.0;
          } else if (f.w >= 1723) {
            instant_w =
                id(power_coefficient) / (double) f.w;
          }

          // Initialize the filter from the first valid frame.
          if (id(filter_sample_count) == 1) {
            id(filtered_raw_v) = median_raw_v;
            id(filtered_raw_i) = median_raw_i;
            id(filtered_raw_w) = median_raw_w;

            id(filtered_voltage) =
                (median_raw_v > 0.0)
                ? id(voltage_coefficient) / median_raw_v
                : 0.0;

            if (!isnan(instant_a))
              id(filtered_current) = instant_a;
            else
              id(filtered_current) = 0.0;

            if (!isnan(instant_w))
              id(filtered_power) = instant_w;
            else
              id(filtered_power) = 0.0;
          } else {
            // Calibration raw-domain EMA.
            id(filtered_raw_v) =
                FILTER_ALPHA * median_raw_v +
                (1.0 - FILTER_ALPHA) * id(filtered_raw_v);

            // Voltage: no fast-step bypass. Real mains changes are slow enough
            // that smoothing is preferable to displaying bridge quantization.
            const double candidate_v =
                (median_raw_v > 0.0)
                ? id(voltage_coefficient) / median_raw_v
                : id(filtered_voltage);

            id(filtered_voltage) =
                FILTER_ALPHA * candidate_v +
                (1.0 - FILTER_ALPHA) * id(filtered_voltage);

            // Current: use the median candidate normally, but reset the EMA
            // immediately when a genuine load step is detected.
            double candidate_a = NAN;
            if (!id(outlet_relay).state) {
              candidate_a = 0.0;
            } else if (median_raw_i >= 362.0 &&
                       id(current_zero_raw) > 0) {
              candidate_a =
                  id(current_coefficient) *
                  ((1.0 / median_raw_i) -
                   (1.0 / (double) id(current_zero_raw)));
              if (candidate_a < 0.0)
                candidate_a = 0.0;
            }

            bool current_step = false;
            if (!id(outlet_relay).state) {
              current_step = true;
            } else if (!isnan(instant_a)) {
              const double delta =
                  fabs(instant_a - id(filtered_current));
              const double scale =
                  fmax(fabs(instant_a), fabs(id(filtered_current)));
              const double threshold =
                  fmax(0.05, 0.30 * scale);
              current_step = delta > threshold;
            }

            if (current_step && !isnan(instant_a)) {
              id(filter_i_1) = f.i;
              id(filter_i_2) = f.i;
              id(filter_i_3) = f.i;
              id(filtered_raw_i) = (double) f.i;
              id(filtered_current) = instant_a;
            } else if (!isnan(candidate_a)) {
              id(filtered_raw_i) =
                  FILTER_ALPHA * median_raw_i +
                  (1.0 - FILTER_ALPHA) * id(filtered_raw_i);
              id(filtered_current) =
                  FILTER_ALPHA * candidate_a +
                  (1.0 - FILTER_ALPHA) * id(filtered_current);
            }

            // Power: same idea, with a 5 W absolute floor for step detection.
            double candidate_w = NAN;
            if (!id(outlet_relay).state || median_raw_w <= 0.0) {
              candidate_w = 0.0;
            } else if (median_raw_w >= 1723.0) {
              candidate_w =
                  id(power_coefficient) / median_raw_w;
            }

            bool power_step = false;
            if (!id(outlet_relay).state) {
              power_step = true;
            } else if (!isnan(instant_w)) {
              const double delta =
                  fabs(instant_w - id(filtered_power));
              const double scale =
                  fmax(fabs(instant_w), fabs(id(filtered_power)));
              const double threshold =
                  fmax(5.0, 0.30 * scale);
              power_step = delta > threshold;
            }

            if (power_step && !isnan(instant_w)) {
              id(filter_w_1) = f.w;
              id(filter_w_2) = f.w;
              id(filter_w_3) = f.w;
              id(filtered_raw_w) = (double) f.w;
              id(filtered_power) = instant_w;
            } else if (!isnan(candidate_w)) {
              id(filtered_raw_w) =
                  FILTER_ALPHA * median_raw_w +
                  (1.0 - FILTER_ALPHA) * id(filtered_raw_w);
              id(filtered_power) =
                  FILTER_ALPHA * candidate_w +
                  (1.0 - FILTER_ALPHA) * id(filtered_power);
            }
          }

          // Expose the smoothed raw values for calibration/debugging only.
          id(filtered_raw_v_display).publish_state((float) id(filtered_raw_v));
          id(filtered_raw_i_display).publish_state((float) id(filtered_raw_i));
          id(filtered_raw_w_display).publish_state((float) id(filtered_raw_w));

          const float volts = (float) id(filtered_voltage);
          const float amps = (float) id(filtered_current);
          const float watts = (float) id(filtered_power);

          // Normal user-facing measurements are deliberately published only
          // every second bridge frame (~10 s). Raw diagnostics still update
          // on every valid 5 s frame.
          id(measurement_publish_counter)++;
          const bool publish_measurements =
              id(measurement_publish_counter) >= 2;

          if (publish_measurements) {
            id(measurement_publish_counter) = 0;

            id(voltage).publish_state(volts);
            id(current).publish_state(amps);
            id(power).publish_state(watts);

            id(current_zero_raw_display).publish_state(
                (float) id(current_zero_raw));
            id(voltage_coefficient_display).publish_state(
                (float) id(voltage_coefficient));
            id(current_coefficient_display).publish_state(
                (float) id(current_coefficient));
            id(power_coefficient_display).publish_state(
                (float) id(power_coefficient));
            id(energy_coefficient_display).publish_state(
                (float) id(energy_coefficient));
          }

          float va = NAN;
          float pf_raw = NAN;
          float pf_display = NAN;

          if (!isnan(volts) && !isnan(amps)) {
            va = volts * amps;

            if (va >= 5.0f && !isnan(watts)) {
              pf_raw = watts / va;
              pf_display = pf_raw;
              if (pf_display < 0.0f)
                pf_display = 0.0f;
              if (pf_display > 1.0f)
                pf_display = 1.0f;
            }

            if (publish_measurements) {
              id(apparent_power).publish_state(va);
              if (va >= 5.0f && !isnan(pf_display))
                id(power_factor).publish_state(pf_display);
              else
                id(power_factor).publish_state(NAN);
            }
          } else if (publish_measurements) {
            id(apparent_power).publish_state(NAN);
            id(power_factor).publish_state(NAN);
          }

          // Energy: valid H frames only. These counters are RAM-only; nothing
          // from Energy/Average Power is periodically written to flash.
          id(energy_total_raw) += (uint64_t) f.h;
          id(energy_cal_raw) += (uint64_t) f.h;
          id(average_power_raw) += (uint64_t) f.h;

          const double energy_kwh =
              (double) id(energy_total_raw) * id(energy_coefficient);
          id(energy).publish_state((float) energy_kwh);

          const double calibration_run_kwh =
              (double) id(energy_cal_raw) * id(energy_coefficient);
          id(energy_calibration_run).publish_state((float) calibration_run_kwh);

          // Slow low-power channel: derive active power from the H energy
          // increment over the ACTUAL elapsed time. This remains useful when
          // the instantaneous W channel has already fallen to Raw W = 0.
          const uint32_t now_ms = millis();

          if (id(average_power_window_start_ms) == 0) {
            id(average_power_window_start_ms) = now_ms;
            id(average_power_raw) = 0;
          } else {
            const uint32_t elapsed_ms =
                (uint32_t) (now_ms - id(average_power_window_start_ms));

            if (elapsed_ms >= 60000U) {
              const double window_kwh =
                  (double) id(average_power_raw) * id(energy_coefficient);
              const double elapsed_s = (double) elapsed_ms / 1000.0;
              const double avg_w =
                  (elapsed_s > 0.0)
                  ? (window_kwh * 3600000.0 / elapsed_s)
                  : 0.0;

              id(average_power).publish_state((float) avg_w);

              ESP_LOGD("wion.average",
                       "60s energy window: raw=%llu elapsed=%.1fs -> %.3f W",
                       (unsigned long long) id(average_power_raw),
                       elapsed_s, avg_w);

              id(average_power_raw) = 0;
              id(average_power_window_start_ms) = now_ms;
            }
          }

          ESP_LOGD("wion.measure",
                   "RAW H=%lu I=%lu W=%lu V=%lu | "
                   "FRAW I=%.1f W=%.1f V=%.1f | "
                   "V=%.2f I=%.4f P=%.2f S=%.2f PFraw=%.4f PF=%.3f | "
                   "K_V=%.6f K_I=%.6f K_P=%.6f K_E=%.12f RawI0=%lu | "
                   "Energy=%.5f kWh AvgP=%.2f W",
                   (unsigned long) f.h,
                   (unsigned long) f.i,
                   (unsigned long) f.w,
                   (unsigned long) f.v,
                   id(filtered_raw_i),
                   id(filtered_raw_w),
                   id(filtered_raw_v),
                   volts, amps, watts, va, pf_raw, pf_display,
                   id(voltage_coefficient),
                   id(current_coefficient),
                   id(power_coefficient),
                   id(energy_coefficient),
                   (unsigned long) id(current_zero_raw),
                   energy_kwh, id(average_power).state);
