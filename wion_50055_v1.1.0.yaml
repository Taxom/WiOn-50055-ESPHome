    internal: true
    update_interval: never

  - platform: template
    id: raw_frame
    name: "Diagnostic - Raw Frame"
    internal: true
    update_interval: never

  - platform: template
    id: zero_calibration_status
    name: "Calibration - Zero Status"
    internal: true
    update_interval: never

  - platform: template
    id: calibration_status
    name: "Calibration - Status"
    internal: true
    update_interval: never

number:
  - platform: template
    id: reference_voltage
    name: "Calibration - Voltage Reference"
    internal: true
    unit_of_measurement: "V"
    optimistic: true
    restore_value: false
    initial_value: 120.0
    min_value: 80.0
    max_value: 140.0
    step: 0.1
    mode: box

  - platform: template
    id: reference_current
    name: "Calibration - Current Reference"
    internal: true
    unit_of_measurement: "A"
    optimistic: true
    restore_value: false
    initial_value: 1.000
    min_value: 0.010
    max_value: 20.000
    step: 0.001
    mode: box

  - platform: template
    id: reference_power
    name: "Calibration - Power Reference"
    internal: true
    unit_of_measurement: "W"
    optimistic: true
    restore_value: false
    initial_value: 100.0
    min_value: 1.0
    max_value: 2000.0
    step: 0.1
    mode: box

  - platform: template
    id: reference_energy
    name: "Calibration - Energy Reference"
    internal: true
    unit_of_measurement: "kWh"
    optimistic: true
    restore_value: false
    initial_value: 0.100
    min_value: 0.001
    max_value: 10.000
    step: 0.001
    mode: box

button:
  - platform: template
    id: start_wifi_setup_button
    name: "Start Wi-Fi Setup AP"
    internal: true
    on_press:
      - script.execute: start_wifi_setup_ap

  - platform: template
    id: calibrate_zero_button
    name: "Calibration - Zero Calibrate"
    internal: true
    on_press:
      - if:
          condition:
            switch.is_off: outlet_relay
          then:
            - lambda: |-
                id(zero_cal_pending) = true;
                id(zero_cal_count) = 0;
                id(zero_cal_sum) = 0;
                id(zero_cal_min) = 0xFFFFFFFFUL;
                id(zero_cal_max) = 0;
                id(zero_calibration_status).publish_state("Collecting zero: 0/5 valid frames");
          else:
            - text_sensor.template.publish:
                id: zero_calibration_status
                state: "Outlet must be OFF"

  - platform: template
    id: reset_energy_calibration_button
    name: "Calibration - Energy Reset Run"
    internal: true
    on_press:
      - lambda: |-
          id(energy_cal_raw) = 0;
          id(energy_calibration_run).publish_state(0.0f);

  - platform: template
    id: calibrate_voltage_button
    name: "Calibration - Voltage Calibrate"
    internal: true
    on_press:
      - lambda: |-
          const double raw_v_value = id(filtered_raw_v);
          const double ref_v = (double) id(reference_voltage).state;
          if (raw_v_value > 0.0 && ref_v > 0.0) {
            id(voltage_coefficient) = ref_v * raw_v_value;
            id(filtered_voltage) = ref_v;
            id(calibration_status).publish_state("Voltage calibration updated");
          }

  - platform: template
    id: calibrate_current_button
    name: "Calibration - Current Calibrate"
    internal: true
    on_press:
      - lambda: |-
          const double raw_i_value = id(filtered_raw_i);
          const double raw_i0 = (double) id(current_zero_raw);
          const double ref_i = (double) id(reference_current).state;
          if (id(outlet_relay).state && raw_i_value > 0.0 && raw_i0 > raw_i_value && ref_i > 0.0) {
            const double denominator = (1.0 / raw_i_value) - (1.0 / raw_i0);
            if (denominator > 0.0) {
              id(current_coefficient) = ref_i / denominator;
              id(filtered_current) = ref_i;
              id(calibration_status).publish_state("Current calibration updated");
            }
          }

  - platform: template
    id: calibrate_power_button
    name: "Calibration - Power Calibrate"
    internal: true
    on_press:
      - lambda: |-
          const double raw_w_value = id(filtered_raw_w);
          const double ref_w = (double) id(reference_power).state;
          if (raw_w_value > 0.0 && ref_w > 0.0) {
            id(power_coefficient) = ref_w * raw_w_value;
            id(filtered_power) = ref_w;
            id(calibration_status).publish_state("Power calibration updated");
          }

  - platform: template
    id: calibrate_energy_button
    name: "Calibration - Energy Calibrate"
    internal: true
    on_press:
      - lambda: |-
          const uint64_t raw_h_sum = id(energy_cal_raw);
          const double ref_e = (double) id(reference_energy).state;
          if (raw_h_sum > 0 && ref_e > 0.0) {
            id(energy_coefficient) = ref_e / (double) raw_h_sum;
            id(energy_total_raw) = 0;
            id(energy_cal_raw) = 0;
            id(energy).publish_state(0.0f);
            id(energy_calibration_run).publish_state(0.0f);
            id(calibration_status).publish_state("Energy calibration updated");
          }

  - platform: template
    id: reset_calibration_defaults_button
    name: "Calibration - Reset Defaults"
    internal: true
    on_press:
      - lambda: |-
          id(voltage_coefficient) = 322499.908463;
          id(current_coefficient) = 7516.962365203;
          id(power_coefficient) = 4618968.684198736;
          id(energy_coefficient) = 0.000001307873567336;
          id(current_zero_raw) = 443876;
          id(calibration_status).publish_state("Calibration reset to reference defaults");

interval:
  - interval: 5s
    then:
      - lambda: |-
          const WionPowerFrame f = wion_read_power_frame();

          char packet[64];
          snprintf(packet, sizeof(packet), "%08lX %08lX %08lX %08lX",
                   (unsigned long) f.words[0],
                   (unsigned long) f.words[1],
                   (unsigned long) f.words[2],
                   (unsigned long) f.words[3]);
          id(raw_frame).publish_state(packet);
          id(frame_status).publish_state(f.valid ? "OK" : "BAD TAGS");

          if (!f.valid)
            return;

          id(raw_h).publish_state((float) f.h);
          id(raw_i).publish_state((float) f.i);
          id(raw_w).publish_state((float) f.w);
          id(raw_v).publish_state((float) f.v);

          if (id(zero_cal_pending) && !id(outlet_relay).state && f.i > 0) {
            id(zero_cal_sum) += f.i;
            if (f.i < id(zero_cal_min)) id(zero_cal_min) = f.i;
            if (f.i > id(zero_cal_max)) id(zero_cal_max) = f.i;
            id(zero_cal_count)++;
            if (id(zero_cal_count) >= 5) {
              const uint32_t raw_zero = (uint32_t) (id(zero_cal_sum) / id(zero_cal_count));
              id(current_zero_raw) = raw_zero;
              id(zero_cal_pending) = false;
              id(zero_calibration_status).publish_state("OK");
            }
          }

          id(energy_total_raw) += f.h;
          id(energy_cal_raw) += f.h;
          id(average_power_raw) += f.h;

          const uint8_t idx = id(filter_sample_count) % 5;
          id(raw_v_history)[idx] = (double) f.v;
          id(raw_i_history)[idx] = (double) f.i;
          id(raw_w_history)[idx] = (double) f.w;
          if (id(filter_sample_count) < 5)
            id(filter_sample_count)++;

          auto median5 = [](double *values, uint8_t count) -> double {
            double tmp[5] = {0,0,0,0,0};
            for (uint8_t i = 0; i < count; i++) tmp[i] = values[i];
            for (uint8_t i = 0; i < count; i++) {
              for (uint8_t j = i + 1; j < count; j++) {
                if (tmp[j] < tmp[i]) {
                  const double t = tmp[i]; tmp[i] = tmp[j]; tmp[j] = t;
                }
              }
            }
            return tmp[count / 2];
          };

          const uint8_t count = id(filter_sample_count);
          const double median_raw_v = median5(id(raw_v_history), count);
          const double median_raw_i = median5(id(raw_i_history), count);
          const double median_raw_w = median5(id(raw_w_history), count);

          const double FILTER_ALPHA = 0.25;

          if (id(filtered_raw_v) <= 0.0) {
            id(filtered_raw_v) = median_raw_v;
            id(filtered_raw_i) = median_raw_i;
            id(filtered_raw_w) = median_raw_w;
          } else {
            id(filtered_raw_v) = FILTER_ALPHA * median_raw_v + (1.0 - FILTER_ALPHA) * id(filtered_raw_v);
            id(filtered_raw_i) = FILTER_ALPHA * median_raw_i + (1.0 - FILTER_ALPHA) * id(filtered_raw_i);
            id(filtered_raw_w) = FILTER_ALPHA * median_raw_w + (1.0 - FILTER_ALPHA) * id(filtered_raw_w);
          }

          id(filtered_raw_v_display).publish_state((float) id(filtered_raw_v));
          id(filtered_raw_i_display).publish_state((float) id(filtered_raw_i));
          id(filtered_raw_w_display).publish_state((float) id(filtered_raw_w));

          const double v = (id(filtered_raw_v) > 0.0)
              ? id(voltage_coefficient) / id(filtered_raw_v)
              : 0.0;

          double a = 0.0;
          if (id(filtered_raw_i) > 0.0 && id(current_zero_raw) > 0) {
            a = id(current_coefficient) *
                ((1.0 / id(filtered_raw_i)) -
                 (1.0 / (double) id(current_zero_raw)));
            if (a < 0.0) a = 0.0;
          }

          const double w = (id(filtered_raw_w) > 0.0)
              ? id(power_coefficient) / id(filtered_raw_w)
              : 0.0;

          id(voltage).publish_state((float) v);
          id(current).publish_state((float) a);
          id(power).publish_state((float) w);

          const double va = v * a;
          id(apparent_power).publish_state((float) va);
          if (va > 0.01 && w >= 0.0)
            id(power_factor).publish_state((float) (w / va));
          else
            id(power_factor).publish_state(NAN);

          const double energy_kwh =
              (double) id(energy_total_raw) * id(energy_coefficient);
          id(energy).publish_state((float) energy_kwh);

          const double calibration_run_kwh =
              (double) id(energy_cal_raw) * id(energy_coefficient);
          id(energy_calibration_run).publish_state((float) calibration_run_kwh);

          const uint32_t now = millis();
          if (id(average_power_window_start_ms) == 0)
            id(average_power_window_start_ms) = now;

          const uint32_t elapsed_ms = now - id(average_power_window_start_ms);
          if (elapsed_ms >= 60000UL) {
            const double window_kwh =
                (double) id(average_power_raw) * id(energy_coefficient);
